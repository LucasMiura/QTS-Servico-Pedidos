[project]
name = "servico-pedidos"
version = "0.1.0"
description = "Servico de orquestracao de pedidos e pagamentos para testes de integracao"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "pydantic>=2.10.0",
    "httpx>=0.28.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "pytest-mock>=3.14.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
addopts = "--cov=app --cov-report=term-missing --cov-report=html"
markers = [
    "unit: testes unitarios isolados",
    "integration: testes de integracao de servicos e endpoints",
    "mocks: testes com isolamento de dependencias e test doubles",
]
filterwarnings = [
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
omit = [
    "*/__init__.py",
]